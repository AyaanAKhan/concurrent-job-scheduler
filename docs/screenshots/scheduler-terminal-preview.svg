<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#0b1020"/>
  <text x="70" y="86" fill="#f8fafc" font-family="Arial, sans-serif" font-size="48" font-weight="700">Concurrent Job Scheduler</text>
  <text x="70" y="126" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">C++17 worker pool, priority scheduling, and graceful shutdown design.</text>
  <rect x="100" y="195" width="1080" height="410" rx="14" fill="#020617" stroke="#334155"/>
  <circle cx="136" cy="230" r="8" fill="#ef4444"/><circle cx="166" cy="230" r="8" fill="#f59e0b"/><circle cx="196" cy="230" r="8" fill="#22c55e"/>
  <text x="130" y="290" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="22">$ mkdir build &amp;&amp; cd build</text>
  <text x="130" y="330" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="22">$ cmake .. -DCMAKE_BUILD_TYPE=Release</text>
  <text x="130" y="370" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="22">$ make &amp;&amp; ./concurrent_job_scheduler</text>
  <text x="130" y="430" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="22">[scheduler] starting 4 worker threads</text>
  <text x="130" y="468" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="22">[queue] accepted priority job: index=17 priority=high</text>
  <text x="130" y="506" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="22">[worker-2] executing job 17</text>
  <text x="130" y="544" fill="#a7f3d0" font-family="JetBrains Mono, monospace" font-size="22">[shutdown] completed outstanding work cleanly</text>
</svg>
